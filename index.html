<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartContent Lab</title>
    <script type="module" crossorigin src="./assets/index-BVoFWJPi.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CdQgCAos.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- CONVERSION ENGINE: VIDEO SWAPPER, STRIPE LINKS & LEAD POPUP -->
    <script>
      (function() {
        // --- 1. STRIPE LINK MANAGEMENT ---
        // Change these to your actual Stripe Payment Links
        const STRIPE_LINKS = {
          audit: "https://buy.stripe.com/test_placeholder_audit", // Free AI Audit
          boardroom: "https://buy.stripe.com/test_placeholder_boardroom", // Profit Boardroom
          content: "https://buy.stripe.com/test_placeholder_content" // AI Content Hub
        };

        // --- 2. VIDEO PLAYER HIJACKER ---
        const videoFiles = [
          'videos/creative-workflow.mp4',
          'videos/high-energy-social-ad.mp4',
          'videos/product-demo-charger.mp4',
          'videos/smart-led-transformation.mp4',
          'videos/tech-accessory-lifestyle.mp4'
        ];
        let videoIndex = 0;
        const getNextVideo = () => videoFiles[videoIndex++ % videoFiles.length];

        const showVideoModal = (videoSrc) => {
          const modal = document.createElement('div');
          modal.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.9);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(10px);';
          
          Object.assign(modal.style, {
            animation: 'fadeIn 0.2s ease-out'
          });

          modal.innerHTML = `
            <div style="width:90%;max-width:1000px;position:relative;animation: slideUp 0.3s ease-out;">
              <button style="position:absolute;top:-50px;right:-10px;color:white;background:rgba(255,255,255,0.1);border-radius:50%;border:none;width:40px;height:40px;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;">&times;</button>
              <div style="width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);">
                <video controls autoplay playsinline style="width:100%;height:100%;object-fit:cover;">
                  <source src="${videoSrc}" type="video/mp4">
                </video>
              </div>
              <p style="text-align:center;color:white;opacity:0.5;margin-top:16px;font-family:sans-serif;font-size:12px;">AI Demo • Powered by SmartContent Lab</p>
            </div>
            <style>
              @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
              @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
            </style>
          `;
          
          modal.querySelector('button').onclick = () => document.body.removeChild(modal);
          modal.querySelector('button').onmouseover = (e) => e.target.style.background = 'rgba(255,255,255,0.2)';
          modal.querySelector('button').onmouseout = (e) => e.target.style.background = 'rgba(255,255,255,0.1)';
          
          document.body.appendChild(modal);
        };

        // Strategy 1: Hide "coming soon" safely without breaking React
        const hideTextPlaceholders = () => {
          document.querySelectorAll('*').forEach(el => {
            if (el.children.length === 0 && el.innerText && el.innerText.toLowerCase().includes('coming soon')) {
              el.style.opacity = '0';
              el.style.pointerEvents = 'none';
            }
            if (el.children.length === 0 && el.innerText && el.innerText.toLowerCase().includes('video file not found')) {
              el.style.display = 'none';
              
              // We found the modal placeholder for missing video! Let's attach a play button automatically here if possible.
              // Or better, let's just make the parent container clickable to show the modal!
              const parent = el.closest('[class*="rounded"]');
              if (parent && !parent.dataset.videoAttached) {
                parent.dataset.videoAttached = 'true';
                parent.style.cursor = 'pointer';
                parent.addEventListener('click', (e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  showVideoModal(getNextVideo());
                });
                
                // Add a visual play indicator
                const playOverlay = document.createElement('div');
                playOverlay.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);border-radius:inherit;z-index:10;';
                playOverlay.innerHTML = '<div style="width:64px;height:64px;border-radius:50%;background:#BA55D3;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(186,85,211,0.5);"><svg width="32" height="32" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>';
                // Make parent position relative if not
                if (window.getComputedStyle(parent).position === 'static') parent.style.position = 'relative';
                parent.appendChild(playOverlay);
              }
            }
          });
        };

        // Strategy 2: Attach click handlers to existing play icon buttons in UI
        const attachPlayButtons = () => {
          document.querySelectorAll('svg').forEach(svg => {
            const paths = svg.querySelectorAll('path, polygon');
            let isPlay = false;
            paths.forEach(p => {
              if (p.getAttribute('d')?.includes('5 19') || p.getAttribute('points')?.includes('5 3 19 12 5 21 5 3')) isPlay = true;
            });
            if (isPlay) {
              const btn = svg.closest('button') || svg.closest('[role="button"]') || svg.closest('div[class*="cursor"]') || svg.parentElement;
              if (btn && !btn.dataset.videoAttached) {
                btn.dataset.videoAttached = 'true';
                btn.style.cursor = 'pointer';
                btn.addEventListener('click', (e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  showVideoModal(getNextVideo());
                });
              }
            }
          });
        };

        // Strategy 3: MutationObserver for dynamically added modals
        const observeModals = () => {
          const observer = new MutationObserver(() => {
            hideTextPlaceholders();
            attachPlayButtons();
          });
          observer.observe(document.body, { childList: true, subtree: true });

          // Also poll for 10 seconds to catch late React renders
          let attempts = 0;
          const poll = setInterval(() => {
            hideTextPlaceholders();
            attachPlayButtons();
            if (++attempts >= 20) clearInterval(poll);
          }, 500);
        };

        // --- 3. CTA BUTTON LINKER ---
        const linkButtons = () => {
          document.querySelectorAll('button, a').forEach(btn => {
            const text = btn.innerText.toLowerCase();
            if (text.includes('request free ai audit')) btn.href = STRIPE_LINKS.audit;
            if (text.includes('profit boardroom')) btn.href = STRIPE_LINKS.boardroom;
            if (text.includes('content hub')) btn.href = STRIPE_LINKS.content;
          });
        };

        // --- 4. EXIT INTENT LEAD POPUP ---
        let popupShown = false;
        const showLeadPopup = () => {
          if (popupShown) return;
          popupShown = true;
          const popup = document.createElement('div');
          popup.id = 'lead-popup';
          popup.innerHTML = `
            <div style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 10000; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.4s ease;">
              <div style="background: #0B0B0D; border: 1px solid rgba(45,98,255,0.3); border-radius: 24px; max-width: 500px; width: 90%; position: relative; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 100px rgba(45,98,255,0.1);">
                <button onclick="this.closest('#lead-popup').remove()" style="position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 10;">&times;</button>
                <img src="/images/viral_hooks_promo.jpg" style="width: 100%; aspect-ratio: 16/9; object-fit: cover;">
                <div style="padding: 30px; text-align: center;">
                  <h3 style="font-size: 1.5rem; font-weight: 700; color: white; margin-bottom: 10px;">Wait! Grab our Viral AI Hook Library</h3>
                  <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 25px;">Stop struggling with engagement. Get 50+ proven AI-generated hooks for Instagram & TikTok — 100% Free.</p>
                  <a href="https://gumroad.com" target="_blank" style="display: block; background: #2D62FF; color: white; padding: 16px; border-radius: 12px; font-weight: 600; text-decoration: none;">Download Free Guide →</a>
                </div>
              </div>
            </div>
          `;
          document.body.appendChild(popup);
          setTimeout(() => popup.firstElementChild.style.opacity = '1', 10);
        };

        document.addEventListener('mouseleave', (e) => { if (e.clientY <= 0) showLeadPopup(); });
        setTimeout(showLeadPopup, 45000);
        
        window.addEventListener('DOMContentLoaded', () => {
          observeModals();
          linkButtons();
        });
      })();
    </script>
  </body>
</html>
